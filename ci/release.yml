name: Build & release

# Tag a commit (git tag v1.0.0 && git push --tags) to publish a release.
# Run it manually from the Actions tab to just get build artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Absent the secret the build still works - Gradle falls back to the debug key.
      # Release-signing matters because only a stable key lets teammates install
      # an update over a version they already have.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reflex.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/reflex.jks" >> "$GITHUB_ENV"
            echo "Release keystore loaded."
          else
            echo "::warning::No KEYSTORE_BASE64 secret - APK will be debug-signed."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk \
             "out/Reflex-${{ needs.version.outputs.version }}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage the web app into the Electron shell
        run: Copy-Item -Recurse -Force www desktop/www

      - name: Set version
        working-directory: desktop
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install
        working-directory: desktop
        run: npm install

      - name: Build installer + portable exe
        working-directory: desktop
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: desktop/dist/*.exe

  release:
    needs: [version, android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          body: |
            **Android** — download `Reflex-${{ needs.version.outputs.version }}.apk`, open it, allow installing from your browser when Android asks.

            **Windows** — `Reflex-Setup-${{ needs.version.outputs.version }}.exe` to install, or `Reflex-Portable-${{ needs.version.outputs.version }}.exe` to run without installing.

            Works fully offline. No permissions, no accounts, no network.
